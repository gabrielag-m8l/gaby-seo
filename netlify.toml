# Netlify config — gabyseo.com

[build]
  publish = "."

# Pretty URLs: serve seo-checklist.html at /seo-checklist
[[redirects]]
  from = "/seo-checklist"
  to = "/seo-checklist.html"
  status = 200

# Blog pretty URLs
[[redirects]]
  from = "/blog/que-es-seo-guia"
  to = "/blog/que-es-seo-guia.html"
  status = 200

[[redirects]]
  from = "/blog/como-aparecer-en-chatgpt-geo"
  to = "/blog/como-aparecer-en-chatgpt-geo.html"
  status = 200

# Force apex domain (www → non-www)
[[redirects]]
  from = "https://www.gabyseo.com/*"
  to = "https://gabyseo.com/:splat"
  status = 301
  force = true

# Security & SEO headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=3600"
